services:
  db:
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: canchas_user
      POSTGRES_PASSWORD: canchas_password
      POSTGRES_DB: canchas_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchas_user -d canchas_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: canchas_user
      DB_PASSWORD: canchas_password
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: canchas_db
      SECRET_KEY: secretkey_canchas123

volumes:
  pgdata: